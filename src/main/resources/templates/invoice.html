<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Receipt</title>

    <style>
        @page {
            size: A4;
            margin: 0;
        }

        body {
            margin: 0;
            background: #e5e5e5;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 210mm;
            min-height: 297mm;
            padding-top: 24mm;
            box-sizing: border-box;
        }

        .invoice {
            width: 320px;
            background: #fff;
            padding: 22px 20px;
            border-radius: 10px;
            border: 1px solid #dcdcdc;
            margin: 0 auto;
        }

        .header {
            text-align: center;
        }

        .divider {
            border-top: 1px dashed #ccc;
            margin: 14px 0;
        }

        .check {
            text-align: center;
            color: rgb(121, 192, 14);
            font-size: 20px;
            margin-bottom: 4px;
        }

        .success {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .row {
            display: table;
            width: 100%;
            table-layout: fixed;
            font-size: 12px;
            margin: 6px 0;
        }

        .row-cell {
            display: table-cell;
            vertical-align: top;
        }

        .row-cell-right {
            text-align: right;
        }

        .row-cell-half {
            width: 50%;
        }

        .row-cell-gap {
            padding-left: 14px;
        }

        .label {
            color: #555;
        }

        .value {
            font-weight: 600;
        }

        .amount {
            color: rgb(121, 192, 14);
            font-weight: 700;
            margin-bottom: 7px;
        }

        .section-title {
            font-size: 10px;
            color: #777;
            margin-top: 25px;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .text {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .status-label {
            text-align: center;
            font-size: 10px;
            color: #777;
            margin-top: 8px;
        }

        .status {
            text-align: center;
            color: rgb(121, 192, 14);
            font-weight: 700;
            font-size: 13px;
            margin-top: 2px;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            margin-top: 10px;
        }

        .date-row {
            margin-top: 19px;
        }
    </style>
</head>

<body>
<div class="page">
    <div class="invoice">
        <div class="header">
            <img
                    th:src="${logoImageSrc}"
                    alt="Logo"
                    style="width:120px;height:auto;" />
        </div>

        <div class="divider"></div>

        <div class="check">
            <img th:src="${tickImageSrc}" alt="Verified" />
        </div>
        <div class="success">Transaction Successful</div>

        <div class="divider"></div>

        <div class="row">
            <div class="row-cell">
                <div class="label">Amount:</div>
            </div>
            <div class="row-cell row-cell-right">
                <div class="amount">INR <span th:text="${amount}">52,000</span></div>
            </div>
        </div>

        <div class="row">
            <div class="row-cell row-cell-half">
                <div class="section-title">BUYER</div>
                <div class="text" th:text="${buyerName}">Suresh Singh</div>

                <div class="section-title">SELLER</div>
                <div class="text" th:text="${sellerName}">Mahesh Agro</div>
            </div>

            <div class="row-cell row-cell-half row-cell-gap">
                <div class="section-title row-cell-right">CROP</div>
                <div class="text row-cell-right" th:text="${cropName}">Barley</div>

                <div class="section-title row-cell-right">VARIETY</div>
                <div class="text row-cell-right" th:text="${variety}">50</div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="row date-row">
            <div class="row-cell">
                <div class="label">Date:</div>
            </div>
            <div class="row-cell row-cell-right">
                <div class="value" th:text="${invoiceDate}">March 10, 2026</div>
            </div>
        </div>

        <div class="row date-row">
            <div class="row-cell">
                <div class="label">Order ID:</div>
            </div>
            <div class="row-cell row-cell-right">
                <div class="value" th:text="${orderReference}">5</div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="row">
            <div class="row-cell">
                <div class="label">Payment Mode:</div>
            </div>
            <div class="row-cell row-cell-right">
                <div class="value" th:text="${paymentMode}">Escrow</div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="status-label">Status</div>
        <div class="status" th:text="${statusLabel}">VERIFIED</div>

        <div class="divider"></div>

        <div class="footer">
            Thank you for your business!<br />
            <br />
            ***************
        </div>
    </div>
</div>
</body>
</html>
