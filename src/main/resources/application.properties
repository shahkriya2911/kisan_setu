# DATABASE CONFIG
spring.application.name=kisan_setu
#spring.datasource.url=${SPRING_DATASOURCE_URL}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.url=jdbc:postgresql://localhost:5432/kisan_setu_db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SERVER CONFIG
server.port=8080
server.address=0.0.0.0

# FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT CONFIG
jwt.secret=mysupersecretkey123456
jwt.access.expiration=3600000
jwt.refresh.expiration=604800000
auth.cookie.secure=false

# MAIL CONFIG
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ADMIN
#app.admin.secret=${APP_ADMIN_SECRET}
app.admin.secret=adminKisanSetu@321

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.data.web.pageable.default-page-size=6

spring.jackson.serialization.write-dates-as-timestamps=true

# CACHE + REDIS
spring.cache.type=${SPRING_CACHE_TYPE:simple}
#spring.redis.host=${SPRING_REDIS_HOST}
#spring.redis.port=${SPRING_REDIS_PORT}
#spring.redis.password=${SPRING_REDIS_PASSWORD}
#spring.redis.ssl=true