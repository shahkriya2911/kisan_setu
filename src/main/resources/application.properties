# ================= DATABASE CONFIG =================
spring.application.name=kisan_setu
spring.datasource.url=jdbc:postgresql://localhost:5432/kisan_setu_db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ================= SERVER CONFIG =================
server.port=8080
server.address=0.0.0.0

# ================= FILE UPLOAD =================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=file:./uploads/

# ================= JWT CONFIG =================
jwt.secret=MySuperSecretKeyForJWTs1234567890
# JWT expiration in milliseconds (1 hour = 3600000 ms)
jwt.expiration=3600000

# ================= SPRING SETTINGS =================
# If you need to allow bean overriding
# spring.main.allow-bean-definition-overriding=true
