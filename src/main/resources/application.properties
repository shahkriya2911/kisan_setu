# ================= DATABASE CONFIG =================
spring.application.name=kisan_setu
spring.datasource.url=jdbc:postgresql://localhost:5432/kisan_setu_db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ================= SERVER CONFIG =================
server.port=8080
server.address=0.0.0.0

# ================= FILE UPLOAD =================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=file:./uploads/

# ================= JWT CONFIG =================
# MUST be at least 256 bits (32+ characters for HS256)
jwt.secret=MySuperSecretKeyForJWTs1234567890MySuperSecretKey

# 15 minutes (Access Token)
jwt.access.expiration=900000

# 7 days (Refresh Token)
jwt.refresh.expiration=604800000

# ================= SPRING SETTINGS =================
# spring.main.allow-bean-definition-overriding=true